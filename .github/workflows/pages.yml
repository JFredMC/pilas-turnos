name: Vista previa en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Si existe la variable de repo PILAS_API_URL, la vista previa usa la API; si no, datos de ejemplo.
      - run: pnpm --filter @pilas/web build:pages
        env:
          PILAS_API_URL: ${{ vars.PILAS_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist/pilas-turnos/browser
      - id: deploy
        uses: actions/deploy-pages@v4
