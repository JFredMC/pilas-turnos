# Blueprint de Render para la API de Pilas + PostgreSQL (mismo estilo que Ñapa).
# En Render: New → Blueprint → repositorio JFredMC/pilas-turnos, rama main.
# Render crea la base, genera JWT_SECRET y conecta DATABASE_URL solo. Pide SEED_PASSWORD (sync: false).
databases:
  - name: pilas-db
    plan: free
    region: oregon
    databaseName: pilas
    user: pilas
    postgresMajorVersion: '17'

services:
  - type: web
    name: pilas-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    # Despliega solo cuando el CI de main pasa.
    autoDeployTrigger: checksPass
    buildCommand: >-
      pnpm install --frozen-lockfile --prod=false --filter @pilas/api... &&
      pnpm --filter @pilas/api build
    # El plan gratuito no tiene preDeployCommand: las migraciones (idempotentes) corren al arrancar.
    startCommand: node apps/api/dist/db/migrate.js && node apps/api/dist/main.js
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/api/**
        - pnpm-lock.yaml
        - package.json
        - render.yaml
      ignoredPaths:
        - apps/api/test/**
        - '**/*.spec.ts'
        - '**/*.md'
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: pilas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://jfredmc.github.io
      # Siembra "salon-ejemplo" al arrancar si no existe (el plan Free no tiene Shell). Pon "false" para apagarlo.
      - key: SEED_DEMO
        value: 'true'
      # Web donde viven los enlaces de los correos (recuperar contraseña).
      - key: APP_URL
        value: https://jfredmc.github.io/pilas-turnos
      # Correo con Amazon SES. Mientras MAIL_PROVIDER no sea "ses", los correos no salen (en producción
      # solo queda un aviso en el log, sin el enlace).
      - key: MAIL_PROVIDER
        value: log
      - key: SES_AWS_REGION
        value: us-east-2
      - key: SES_FROM_EMAIL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Recordatorios por WhatsApp Cloud API (sin token no se envían; el panel da enlaces wa.me).
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        value: recordatorio_cita
      # Token del cron de GitHub Actions (mismo valor que el secreto PILAS_CRON_TOKEN).
      - key: CRON_TOKEN
        sync: false
      - key: RECORDATORIOS_CADA_MIN
        value: '10'
      # Contraseña de los usuarios de ejemplo si se corre el seed (no se versiona).
      - key: SEED_PASSWORD
        sync: false
